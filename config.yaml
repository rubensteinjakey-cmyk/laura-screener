# ---------------------------------------------------------------
# Laura Gao 10-K Values Screener: settings
# Every teammate uses this same file. Only change the lines marked
# "CHANGE THIS".
# ---------------------------------------------------------------

# The SEC requires every request to say who is asking.
# CHANGE THIS to your own name and email.
user_agent:
  name: "Jakey Rubenstein"
  email: "rubensteinjakey@gmail.com"

# The Claude model used for scoring. Everyone MUST use the same one
# so scores are comparable. Use the full ID (not just "opus") so the
# model doesn't silently change when a new version comes out.
model: "claude-opus-5-5"

# How hard the model thinks (low, medium, high, xhigh, max). Fixed here so
# it doesn't depend on each teammate's personal Claude Code settings.
effort: "high"

# Which 10-K sections the AI reads. Decided (Rubric v2.1): Item 1 +
# "targeted MD&A" (only the MD&A paragraphs that mention foundation,
# community, education, small business, artists, etc.).
# Other options, for tests only: [item1] or [item1, item7] (full MD&A).
sections: [item1, item7_targeted]

# A label for your scoring run. CHANGE THIS to your first name.
# Score files are saved as data/scores/{TICKER}_{run_id}.json, so using your
# name means teammates never overwrite each other's files in GitHub.
# To score the same companies again (e.g. a consistency check) without
# overwriting, use --run-id on the command line, e.g. --run-id jakey_repeat
run_id: "jakey"

# Which rows of companies.csv to process (1 = first company).
# Can also be set on the command line: --start 1 --end 66
batch:
  start: 1
  end: 9999

# Seconds to wait between SEC requests (SEC limit is 10 per second).
sec_delay_seconds: 0.15

# Max seconds to wait for one Claude scoring call before giving up.
claude_timeout_seconds: 900

# Shortlist (rank.py): the top share of each sector by final score gets
# in_shortlist = true. Ties with the last spot are included, and every
# sector keeps at least shortlist_min_per_sector companies.
shortlist_pct: 0.30   # was 0.40 until Oct 20 (see DECISIONS.md)
shortlist_min_per_sector: 2

# How much a sustainability-report rescore counts (verify.py). For each theme
# rescored in a second look: final = 10-K score + report_weight x
# (report score - 10-K score). Team decision, Oct 19: 0.5 (see DECISIONS.md).
report_weight: 0.5

# ---- Global sleeve screen (run_global.py; companies_global.csv) ----
# Each red flag with a verified quote subtracts this many points from the
# alignment score (floor 0). See DECISIONS.md (Oct 23).
red_flag_penalty: 10
# Max words of annual-report text sent per company; above this the
# lowest-relevance keyword paragraphs are dropped first (and logged).
global_max_words: 40000
global_run_id: global
